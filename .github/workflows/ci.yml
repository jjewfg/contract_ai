name: CI

on: [push]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check . --select E9,F63,F7,F82

      - name: Syntax check
        run: python -c "import ast; [ast.parse(open(f, encoding='utf-8').read()) for f in ['app.py','extract.py','gen_data.py','evaluate2.py']]; print('syntax OK')"

      - name: Build Docker image
        run: docker build -t contract-extractor .
